version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: earth-agents-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-n8n}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-n8n}
      - POSTGRES_DB=${POSTGRES_DB:-n8n}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - earth-agents-network

  # Redis Cache (optional, for better performance)
  redis:
    image: redis:7-alpine
    container_name: earth-agents-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - earth-agents-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # N8N Application
  n8n:
    image: n8nio/n8n:latest
    container_name: earth-agents-n8n
    restart: unless-stopped
    environment:
      # Database Configuration
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-n8n}
      
      # Redis Configuration (optional)
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      
      # N8N Configuration
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678}
      
      # Security
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-true}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-password}
      
      # Earth Agents Configuration
      - EARTH_AGENTS_API_URL=${EARTH_AGENTS_API_URL:-http://localhost:8080}
      - EARTH_AGENTS_API_KEY=${EARTH_AGENTS_API_KEY}
      
      # External Service Configuration
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - SLACK_WEBHOOK=${SLACK_WEBHOOK}
      - NOTION_API_KEY=${NOTION_API_KEY}
      - DATADOG_API_KEY=${DATADOG_API_KEY}
      - PAGERDUTY_API_KEY=${PAGERDUTY_API_KEY}
      
      # Workflow Configuration
      - EXECUTIONS_PROCESS=main
      - EXECUTIONS_MODE=regular
      - EXECUTIONS_TIMEOUT=3600
      - EXECUTIONS_MAX_TIMEOUT=3600
      
      # Logging
      - N8N_LOG_LEVEL=${N8N_LOG_LEVEL:-info}
      - N8N_LOG_OUTPUT=console
      
      # Performance
      - N8N_PAYLOAD_DEFAULT_MAX_SIZE=16
      - N8N_METRICS=true
      
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/opt/workflows:ro
      - ./credentials:/opt/credentials:ro
      - ./scripts:/opt/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - earth-agents-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Workflow Monitor & Manager
  earth-agents-cli:
    build:
      context: .
      dockerfile: Dockerfile.cli
    container_name: earth-agents-cli
    restart: unless-stopped
    environment:
      - N8N_API_URL=http://n8n:5678
      - N8N_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-password}
      - EARTH_AGENTS_ENV=${EARTH_AGENTS_ENV:-development}
    volumes:
      - ./scripts:/app/scripts
      - ./workflows:/app/workflows
      - ./logs:/app/logs
      - n8n_data:/app/n8n_data:ro
    depends_on:
      - n8n
    networks:
      - earth-agents-network

networks:
  earth-agents-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  n8n_data:
    driver: local